name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # 1. Navegar al repositorio del servidor
            cd /root/drip_diamond_web

            # 2. Obtener los cambios más recientes de la rama main
            git fetch origin main
            git reset --hard origin/main

            # 3. Instalar dependencias y compilar Vite
            npm install
            npm run build

            # 4. Copiar los archivos generados a la ruta que lee Nginx
            mkdir -p /var/www/drip_diamond_frontend/dist
            cp -r /root/drip_diamond_web/dist/* /var/www/drip_diamond_frontend/dist/

            # 5. Reiniciar Nginx
            systemctl restart nginx
